name: CI

on:
  push:
    branches:
      - main
      - "refactoring/**"
      - "feature/**"
      - "fix/**"

  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install project
        run: uv sync --locked --all-extras

      - name: Check linting
        run: uv run --no-sync ruff check .

      - name: Check formatting
        run: uv run --no-sync ruff format --check .

      - name: Run tests
        run: |
          env -u PROJ_DATA -u PROJ_LIB \
            uv run --no-sync python -m unittest discover -s tests -v

  wheel-inference:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Build wheel
        run: uv build --wheel --out-dir "$RUNNER_TEMP/cropgrm-dist"

      - name: Install wheel with base dependencies in a clean environment
        run: |
          uv venv "$RUNNER_TEMP/cropgrm-wheel-env" --python 3.12
          uv pip install --python "$RUNNER_TEMP/cropgrm-wheel-env/bin/python" \
            "$RUNNER_TEMP"/cropgrm-dist/*.whl

      - name: Load bundled models and predict outside the checkout
        run: |
          mkdir -p "$RUNNER_TEMP/cropgrm-smoke"
          cd "$RUNNER_TEMP/cropgrm-smoke"
          "$RUNNER_TEMP/cropgrm-wheel-env/bin/python" -I \
            "$GITHUB_WORKSPACE/tests/smoke_installed_package.py"
