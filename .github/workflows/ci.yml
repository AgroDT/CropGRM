name: CI

on:
  push:
    branches:
      - main
      - "refactoring/**"
      - "feature/**"
      - "fix/**"

  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install project
        run: uv sync --locked --all-extras

      - name: Check linting
        run: uv run --no-sync ruff check .

      - name: Check formatting
        run: uv run --no-sync ruff format --check .

      - name: Run tests
        run: |
          env -u PROJ_DATA -u PROJ_LIB \
            uv run --no-sync python -m unittest discover -s tests -v

  base-inference:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Install base package only
        run: uv sync --locked --no-dev

      - name: Check base inference and CSV export
        run: >-
          uv run --no-sync python -m unittest discover
          -s tests -p test_base_inference.py -v
